name: Python

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Dépendances
        run: pip install -q -r python/requirements-dev.txt
      - name: Tests
        run: cd python && pytest -q
      - name: Image Docker
        run: docker build -q -f python/Dockerfile -t digita-web .
