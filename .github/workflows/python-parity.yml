name: Parité PHP / Python

# Vérifie que la version Python rend exactement le même HTML que le site PHP
# sur toutes les pages publiques (accueil, pages, catégories, articles, formations).
on:
  pull_request:
    branches: [ main ]
    paths: [ "python/**", "app/**", "includes/**", "templates/**", "public/**", "database/**", ".github/workflows/python-parity.yml" ]
  workflow_dispatch: {}

jobs:
  parity:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: [ "3306:3306" ]
        options: >-
          --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=20
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: ines
          POSTGRES_PASSWORD: ines
          POSTGRES_DB: digita
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd="pg_isready -U ines" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Dépendances Python
        run: |
          python -m venv python/.venv
          python/.venv/bin/pip install -q -r python/requirements-dev.txt

      - name: Tests unitaires
        run: cd python && .venv/bin/pytest -q

      - name: Parité HTML (toutes les pages publiques)
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PWD: root
          PG_URL: postgresql+psycopg2://ines:ines@127.0.0.1/digita
        run: bash python/tools/parity_ci.sh
