# À ajouter dans monitoring/nginx/nginx.conf du dépôt INES (bloc http), AVANT le vhost
# « domaines personnalisés ». Un server_name exact est prioritaire sur la regex catch-all,
# donc ines.weballone.com et les pages Page Builder (lp48.digita.buzz…) ne sont pas touchés.
# Le certificat est posé par : bash scripts/add-custom-domain.sh digita.buzz

    server {
        listen 80;
        server_name digita.buzz www.digita.buzz;
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {
            return 301 https://digita.buzz$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name digita.buzz www.digita.buzz;

        ssl_certificate     /etc/nginx/certs/domains/digita.buzz.crt;
        ssl_certificate_key /etc/nginx/certs/domains/digita.buzz.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options SAMEORIGIN;
        client_max_body_size 20M;

        # www → domaine nu
        if ($host = www.digita.buzz) {
            return 301 https://digita.buzz$request_uri;
        }

        resolver 127.0.0.11 valid=30s ipv6=off;
        set $digita "http://digita-web:8000";

        location /assets/ {
            proxy_pass $digita;
            proxy_set_header Host $host;
            expires 30d;
        }

        location / {
            proxy_pass $digita;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }
    }
