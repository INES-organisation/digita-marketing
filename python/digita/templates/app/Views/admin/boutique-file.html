<div class="container-fluid px-4 py-4">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <h1 class="h3 mb-0"><i class="bi bi-file-earmark-text text-primary"></i> {{ fileName }}</h1>
        <div class="d-flex gap-2">
            <a href="/admin/boutique/fichier/{{ fileName }}?download=1" class="btn btn-primary"><i class="bi bi-download"></i> Télécharger</a>
            <a href="/admin/boutique" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> Boutique</a>
        </div>
    </div>
    <div class="card"><div class="card-body">
        <pre class="mb-0" style="white-space: pre-wrap; font-family: inherit; font-size: 0.92rem; line-height: 1.6;">{{ h(content) }}</pre>
    </div></div>
</div>
